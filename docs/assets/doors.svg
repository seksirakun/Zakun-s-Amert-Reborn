<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title">
  <title id="title">Map Door values and the prefab the server spawns</title>
  <rect width="960" height="280" fill="#f6f3ec"/>
  <text x="24" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1c1917">Map Door ’ game prefab</text>
  <text x="24" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#44403c">The number in MapDoors.json is the Unity enum. The server maps it. Leave old files alone.</text>
  <g font-family="Consolas, Courier New, monospace" font-size="14" fill="#1c1917">
    <rect x="24" y="72" width="912" height="32" fill="#1c1917"/>
    <text x="40" y="93" fill="#f6f3ec">Unity value    Inspector name                         Server spawns</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      <rect x="24" y="104" width="912" height="28" fill="#fff" stroke="#e7e5e4"/>
      <text x="40" y="123">0, 1</text><text x="200" y="123">LCZ, Light Containment</text><text x="560" y="123">LCZ BreakableDoor</text>
      <rect x="24" y="132" width="912" height="28" fill="#fafaf9" stroke="#e7e5e4"/>
      <text x="40" y="151">2, 3</text><text x="200" y="151">HCZ, Heavy Containment</text><text x="560" y="151">HCZ BreakableDoor</text>
      <rect x="24" y="160" width="912" height="28" fill="#fff" stroke="#e7e5e4"/>
      <text x="40" y="179">4, 5</text><text x="200" y="179">EZ, Entrance</text><text x="560" y="179">EZ BreakableDoor</text>
      <rect x="24" y="188" width="912" height="28" fill="#fafaf9" stroke="#e7e5e4"/>
      <text x="40" y="207">6, 7</text><text x="200" y="207">Bulk, Heavy Bulk</text><text x="560" y="207">HCZ BulkDoor</text>
      <rect x="24" y="216" width="912" height="28" fill="#fff" stroke="#e7e5e4"/>
      <text x="40" y="235">8</text><text x="200" y="235">Gate</text><text x="560" y="235">Spawnable Unsecured Pryable GateDoor</text>
    </g>
  </g>
  <text x="24" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#44403c">Entrance is the default. It is stored as 5 and spawns an EZ door on the object's position, rotation and scale.</text>
</svg>
